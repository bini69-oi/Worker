name: ci

on:
  push:
  pull_request:

# Токен CI только читает код: ни запушить, ни поменять релизы из CI нельзя.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Действия закреплены по хэшу коммита: подмена тега у автора действия не попадёт в сборку.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: make check
      - run: make vuln
