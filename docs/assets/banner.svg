<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03130b"/>
      <stop offset="0.55" stop-color="#062a18"/>
      <stop offset="1" stop-color="#0b3d22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2f7d4f" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="28" fill="url(#glow)"/>

  <!-- сеть узлов справа -->
  <g stroke="#4ade80" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M900 120 L1010 80 L1120 150 L1060 260 L940 250 Z"/>
    <path d="M900 120 L1060 260 M1010 80 L940 250 M1120 150 L940 250"/>
  </g>
  <g fill="#4ade80">
    <circle cx="900" cy="120" r="9"/>
    <circle cx="1010" cy="80" r="7"/>
    <circle cx="1120" cy="150" r="10"/>
    <circle cx="1060" cy="260" r="8"/>
    <circle cx="940" cy="250" r="7"/>
  </g>
  <circle cx="1010" cy="175" r="34" fill="#052e1a" stroke="#a3e635" stroke-width="3"/>
  <path d="M996 175 l10 10 l20 -22" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="182" font-size="150" font-weight="800" fill="#f0fdf4" letter-spacing="-4">M<tspan fill="url(#num)">32</tspan></text>
    <text x="78" y="238" font-size="34" font-weight="600" fill="#d1fae5">Бот продажи VPN-подписок для Remnawave</text>
    <text x="78" y="276" font-size="22" fill="#86efac" fill-opacity="0.85">Telegram-бот, Mini App и кабинет на одном ядре. Открытый, бесплатный, MIT.</text>

    <g font-size="18" font-weight="600" fill="#bbf7d0">
      <rect x="78" y="306" width="138" height="38" rx="19" fill="#052e1a" stroke="#4ade80" stroke-opacity="0.7"/>
      <text x="147" y="331" text-anchor="middle">один файл</text>
      <rect x="228" y="306" width="110" height="38" rx="19" fill="#052e1a" stroke="#4ade80" stroke-opacity="0.7"/>
      <text x="283" y="331" text-anchor="middle">SQLite</text>
      <rect x="350" y="306" width="178" height="38" rx="19" fill="#052e1a" stroke="#4ade80" stroke-opacity="0.7"/>
      <text x="439" y="331" text-anchor="middle">Telegram Stars</text>
      <rect x="540" y="306" width="176" height="38" rx="19" fill="#052e1a" stroke="#4ade80" stroke-opacity="0.7"/>
      <text x="628" y="331" text-anchor="middle">Remnawave 2/3</text>
      <rect x="728" y="306" width="84" height="38" rx="19" fill="#14532d" stroke="#a3e635"/>
      <text x="770" y="331" text-anchor="middle" fill="#ecfccb">MIT</text>
    </g>
  </g>
